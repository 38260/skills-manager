<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Skills Manager</title>
    <style>
      /* 启动占位页：只依赖内联样式，双击后随窗口立刻出现，本地服务就绪即被应用页面替换。
         与 index.html 里的首屏占位保持同一套变量与视觉（那边是网页加载后的接力）。 */
      :root {
        color-scheme: dark;
        --boot-bg: #0d0d0f;
        --boot-fg: #e6e6ea;
        --boot-muted: #8b8b94;
        --boot-accent: #3ba55d;
        --boot-track: rgba(230, 230, 234, 0.14);
      }
      html.boot-light {
        color-scheme: light;
        --boot-bg: #f7f7f9;
        --boot-fg: #18181b;
        --boot-muted: #65656e;
        --boot-track: rgba(24, 24, 27, 0.12);
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--boot-bg);
        color: var(--boot-fg);
        font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      }
      .boot-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
        color: var(--boot-fg);
      }
      .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .boot-mark {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .boot-bar {
        width: 168px;
        height: 3px;
        border-radius: 999px;
        background: var(--boot-track);
        overflow: hidden;
      }
      .boot-bar > span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: var(--boot-accent);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      .boot-hint {
        color: var(--boot-muted);
        font-size: 12px;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar > span {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <script>
      // 与 useTheme() 的取值保持一致：非法/缺失 → system；只有显式选项才覆盖系统。
      (function () {
        var t = "system";
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark" || stored === "system") t = stored;
        } catch (error) {
          /* localStorage 不可用时仍按系统主题渲染 */
        }
        var resolved =
          t === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : t;
        if (resolved === "light") document.documentElement.classList.add("boot-light");
      })();
    </script>
  </head>
  <body>
    <div class="boot-root" role="status" aria-live="polite">
      <div class="boot-inner">
        <div class="boot-mark">Skills Manager</div>
        <div class="boot-bar"><span></span></div>
        <div class="boot-hint">正在启动本地服务…</div>
      </div>
    </div>
  </body>
</html>
