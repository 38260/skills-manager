<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills Manager</title>
    <style>
      /* 首屏占位：内联在内置样式之前生效，避免 React 挂载前出现白屏。
         与 electron/splash.html 是同一套视觉（那边负责「窗口出现 → 网页开始加载」这一段）。 */
      :root {
        color-scheme: dark;
        --boot-bg: #0d0d0f;
        --boot-fg: #e6e6ea;
        --boot-muted: #8b8b94;
        --boot-accent: #3ba55d;
        --boot-track: rgba(230, 230, 234, 0.14);
      }
      html.boot-light {
        color-scheme: light;
        --boot-bg: #f7f7f9;
        --boot-fg: #18181b;
        --boot-muted: #65656e;
        --boot-track: rgba(24, 24, 27, 0.12);
      }
      body {
        background: var(--boot-bg);
        color: var(--boot-fg);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
        /* 颜色/字体写在 #boot-splash 上而不是 body 上：应用样式表（index.css 的
           body { bg-background text-primary }）在源码顺序上更靠后，同优先级会盖掉 body；
           id 选择器优先级更高，这里才不会被应用主题的默认（浅色）文字色污染。 */
        color: var(--boot-fg);
        font: 14px/1.5 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
        transition: opacity 0.18s ease;
      }
      #boot-splash.is-done {
        opacity: 0;
      }
      #boot-splash .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #boot-splash .boot-mark {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #boot-splash .boot-bar {
        width: 168px;
        height: 3px;
        border-radius: 999px;
        background: var(--boot-track);
        overflow: hidden;
      }
      #boot-splash .boot-bar > span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: var(--boot-accent);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      #boot-splash .boot-hint {
        color: var(--boot-muted);
        font-size: 12px;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-bar > span {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <script>
      // 与 useTheme() 的取值保持一致：非法/缺失 → dark；system → 跟随系统。
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark" && t !== "system") t = "dark";
          var resolved =
            t === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : t;
          if (resolved === "light") document.documentElement.classList.add("boot-light");
        } catch (error) {
          /* localStorage 不可用时按深色渲染 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-inner">
        <div class="boot-mark">Skills Manager</div>
        <div class="boot-bar"><span></span></div>
        <div class="boot-hint">正在启动本地服务…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
